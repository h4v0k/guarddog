name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run -e m5stack

      - name: Merge into one flashable image
        run: |
          B=.pio/build/m5stack
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 merge_bin \
            -o guarddog.bin --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin
          ls -la guarddog.bin $B/firmware.bin
          VERSION=$(grep -oP '#define SW_VERSION "\K[^"]+' src/common.h)
          mkdir -p site
          cp web/* site/
          cp guarddog.bin site/
          sed -i "s/__VERSION__/$VERSION/g; s/__BUILD__/${GITHUB_SHA::7}/g" site/index.html site/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: guarddog-firmware
          path: guarddog.bin

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
